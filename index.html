<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSCRMA Site Manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-bg: #1A1A2E;
    --teal: #1A8A8A;
    --teal-bright: #2ABFBF;
    --teal-dark: #0D6B6B;
    --teal-focus: rgba(26,138,138,0.12);
    --text: #1A1A2E;
    --muted: #4A5568;
    --bg: #F8FAFB;
    --white: #FFFFFF;
    --border: #E2E8F0;
    --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --sidebar-w: 260px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
  }

  body { display: flex; flex-direction: row; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    height: 100vh;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Logotype */
  .sidebar-logo {
    padding: 28px 20px 22px;
    text-align: center;
    flex-shrink: 0;
  }
  .logo-top {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal-bright);
    line-height: 1;
    margin-bottom: 10px;
  }
  .logo-rule {
    width: 60%;
    margin: 0 auto 10px;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.15);
  }
  .logo-main {
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 5px;
  }
  .logo-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.02em;
  }

  /* New Request button */
  .sidebar-new-btn {
    display: block;
    margin: 0 12px 20px;
    padding: 10px 16px;
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .sidebar-new-btn:hover { background: var(--teal-dark); }

  /* History */
  .sidebar-section-label {
    padding: 0 16px 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
  }

  .sidebar-history {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .sidebar-history::-webkit-scrollbar { width: 3px; }
  .sidebar-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .history-item {
    display: block;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: none;
    border-radius: 6px;
    color: rgba(255,255,255,0.7);
    font-family: var(--font);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover {
    background: rgba(255,255,255,0.06);
    color: var(--white);
  }

  /* Sidebar bottom bar */
  .sidebar-bottom {
    flex-shrink: 0;
    padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-repo {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .repo-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }
  .repo-dot.live { background: #34D399; }
  .repo-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-gear {
    background: none;
    border: none;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.2s;
  }
  .sidebar-gear:hover { color: rgba(255,255,255,0.8); }

  /* ── MAIN AREA ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
  }

  /* Chat header */
  .chat-header {
    height: 48px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .chat-header-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  /* Hamburger (mobile only) */
  .hamburger {
    display: none;
    position: absolute;
    left: 16px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }

  /* Messages feed */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .messages-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Bubbles */
  .bubble-row {
    display: flex;
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 80%;
    font-size: 14px;
    line-height: 1.6;
    border-radius: 18px;
    padding: 12px 16px;
    word-break: break-word;
  }
  .bubble-row.user .bubble {
    background: var(--teal);
    color: var(--white);
    border-radius: 18px 18px 4px 18px;
  }
  .bubble-row.assistant .bubble {
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 18px 18px 18px 4px;
  }
  .bubble-row.assistant.error .bubble {
    background: #FEF2F2;
    border-color: #FECACA;
    color: #991B1B;
  }

  /* Thinking dots */
  .thinking-dots {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 4px 2px;
  }
  .thinking-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.4;
    animation: tdot 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tdot { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 0.7; transform: scale(1); } }

  /* Diff block inside bubble */
  .diff-block {
    margin-top: 10px;
    background: #1A1A2E;
    border-radius: 8px;
    overflow: hidden;
    max-height: 200px;
    overflow-y: auto;
  }
  .diff-block::-webkit-scrollbar { width: 3px; }
  .diff-block::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .diff-line {
    display: flex;
    padding: 1px 12px;
    font-family: "SF Mono", "Fira Code", Menlo, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre;
  }
  .diff-line.add { color: #2ABFBF; }
  .diff-line.del { color: #FF6B6B; }
  .diff-line.ctx { color: rgba(255,255,255,0.35); }
  .diff-line.sep {
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    justify-content: center;
    padding: 3px 12px;
    font-style: italic;
  }
  .diff-prefix { width: 14px; flex-shrink: 0; }
  .diff-text { flex: 1; overflow-x: hidden; text-overflow: ellipsis; }

  /* Diff action buttons */
  .diff-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn-confirm {
    padding: 9px 20px;
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 50px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-confirm:hover { background: var(--teal-dark); }
  .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-cancel-diff {
    padding: 9px 16px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 50px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel-diff:hover { border-color: #FECACA; color: #991B1B; }
  .btn-cancel-diff:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── INPUT AREA ── */
  .input-area {
    flex-shrink: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }
  .input-inner {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26,138,138,0.1);
  }
  #userInput {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    resize: none;
    min-height: 22px;
    max-height: 120px;
    overflow-y: auto;
  }
  #userInput::placeholder { color: #A0AEC0; }
  #userInput:disabled { opacity: 0.5; }

  #sendBtn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--teal);
    border: none;
    color: var(--white);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, opacity 0.2s;
    padding: 0;
  }
  #sendBtn:hover:not(:disabled) { background: var(--teal-dark); }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #sendBtn svg { width: 15px; height: 15px; }

  /* ── SETTINGS PANEL ── */
  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.3);
  }
  .settings-overlay.open { display: block; }

  .settings-panel {
    position: fixed;
    top: 0;
    right: -340px;
    width: 320px;
    height: 100vh;
    background: var(--white);
    box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    z-index: 101;
    display: flex;
    flex-direction: column;
    transition: right 0.25s ease;
    overflow-y: auto;
  }
  .settings-panel.open { right: 0; }

  .settings-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .settings-panel-head h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .settings-close {
    background: none;
    border: none;
    font-size: 20px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .settings-close:hover { color: var(--text); }

  .settings-body {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .field input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26,138,138,0.1);
  }
  .field input::placeholder { color: #A0AEC0; }
  .field-hint {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .field-hint a { color: var(--teal); text-decoration: none; }
  .field-hint a:hover { text-decoration: underline; }
  .token-helper {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }

  .settings-save {
    margin: 8px 24px 24px;
    padding: 13px;
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 50px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .settings-save:hover { background: var(--teal-dark); }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      z-index: 50;
      transition: left 0.25s ease;
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 49;
      background: rgba(0,0,0,0.4);
    }
    .sidebar-overlay.open { display: block; }
    .hamburger { display: flex; }
    .chat-header { position: relative; }
  }
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">

  <div class="sidebar-logo">
    <div class="logo-top">Life Sciences</div>
    <hr class="logo-rule">
    <div class="logo-main">CRM Advisors</div>
    <div class="logo-sub">Site Manager</div>
  </div>

  <button class="sidebar-new-btn" onclick="newRequest()">+ New Request</button>

  <div class="sidebar-section-label">Recent Changes</div>
  <div class="sidebar-history">
    <button class="history-item">Phone number update</button>
    <button class="history-item">Hero text change</button>
    <button class="history-item">About section edit</button>
  </div>

  <div class="sidebar-bottom">
    <div class="sidebar-repo">
      <div class="repo-dot" id="repoDot"></div>
      <span class="repo-label" id="repoLabel">Not configured</span>
    </div>
    <button class="sidebar-gear" onclick="openSettings()" title="Settings">⚙</button>
  </div>

</aside>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

<!-- ── MAIN ── -->
<div class="main">

  <div class="chat-header">
    <button class="hamburger" id="hamburger" onclick="openMobileSidebar()">☰</button>
    <span class="chat-header-title">LSCRMA Site Manager</span>
  </div>

  <div class="messages" id="messages">
    <div class="messages-inner" id="messagesInner"></div>
  </div>

  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
        <textarea
          id="userInput"
          placeholder="Describe a change to make to the website..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="sendBtn" onclick="makeChange()" title="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ── SETTINGS PANEL ── -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-panel-head">
    <h2>Settings</h2>
    <button class="settings-close" onclick="closeSettings()">×</button>
  </div>
  <div class="settings-body">
    <div class="field">
      <label>Anthropic API Key</label>
      <input type="password" id="anthropicKey" placeholder="sk-ant-..." autocomplete="off">
      <div class="field-hint">Get yours at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys</div>
    </div>
    <div class="field">
      <label>🔑 GitHub Personal Access Token</label>
      <input type="password" id="githubToken" placeholder="ghp_..." autocomplete="off">
      <div class="field-hint"><a href="https://github.com/settings/tokens/new" target="_blank">Create one here</a> — enable the <strong>repo</strong> scope.</div>
      <div class="token-helper">Never stored or transmitted anywhere except directly to GitHub.</div>
    </div>
    <div class="field">
      <label>GitHub Username</label>
      <input type="text" id="githubUser" placeholder="awalsh24">
    </div>
    <div class="field">
      <label>Repository Name</label>
      <input type="text" id="githubRepo" placeholder="lscrma.com">
    </div>
    <div class="field">
      <label>HTML Filename</label>
      <input type="text" id="githubFile" placeholder="index.html">
    </div>
  </div>
  <button class="settings-save" onclick="saveSettings()">Save</button>
</div>

<script>
// ── STATE ──
let pendingHTML = null;
let currentSHA  = null;
let isLoading   = false;

// ── SETTINGS ──
function loadSettings() {
  ['anthropicKey','githubToken','githubUser','githubRepo','githubFile'].forEach(k => {
    const v = localStorage.getItem('lscrma_' + k);
    if (v) document.getElementById(k).value = v;
  });
  if (!document.getElementById('githubUser').value) document.getElementById('githubUser').value = 'awalsh24';
  if (!document.getElementById('githubRepo').value) document.getElementById('githubRepo').value = 'lscrma.com';
  if (!document.getElementById('githubFile').value) document.getElementById('githubFile').value = 'index.html';
  updateRepoStatus();
}

function saveSettings() {
  ['anthropicKey','githubToken','githubUser','githubRepo','githubFile'].forEach(k => {
    localStorage.setItem('lscrma_' + k, document.getElementById(k).value.trim());
  });
  closeSettings();
  updateRepoStatus();
}

function getSetting(k) { return localStorage.getItem('lscrma_' + k) || ''; }

function updateRepoStatus() {
  const configured = getSetting('anthropicKey') && getSetting('githubToken') && getSetting('githubUser');
  const dot   = document.getElementById('repoDot');
  const label = document.getElementById('repoLabel');
  if (configured) {
    dot.className   = 'repo-dot live';
    label.textContent = getSetting('githubUser') + '/' + getSetting('githubRepo');
  } else {
    dot.className   = 'repo-dot';
    label.textContent = 'Not configured';
  }
}

function openSettings() {
  loadSettings();
  document.getElementById('settingsPanel').classList.add('open');
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('settingsOverlay').classList.remove('open');
}

// ── MOBILE SIDEBAR ──
function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ── CHAT UI ──
function scrollToBottom() {
  const feed = document.getElementById('messages');
  feed.scrollTop = feed.scrollHeight;
}

function appendBubble(role, contentEl) {
  const feed = document.getElementById('messagesInner');
  const row  = document.createElement('div');
  row.className = 'bubble-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (typeof contentEl === 'string') {
    bubble.textContent = contentEl;
  } else {
    bubble.appendChild(contentEl);
  }
  row.appendChild(bubble);
  feed.appendChild(row);
  scrollToBottom();
  return { row, bubble };
}

function appendUserBubble(text) {
  appendBubble('user', text);
}

function appendThinkingBubble() {
  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  const { row } = appendBubble('assistant', dots);
  return {
    replace(contentEl) {
      const bubble = row.querySelector('.bubble');
      bubble.innerHTML = '';
      if (typeof contentEl === 'string') {
        bubble.textContent = contentEl;
      } else {
        bubble.appendChild(contentEl);
      }
      scrollToBottom();
      return bubble;
    },
    remove() { row.remove(); }
  };
}

function appendErrorBubble(message) {
  const { row } = appendBubble('assistant', message);
  row.classList.add('error');
}

// ── INPUT HELPERS ──
function setInputEnabled(enabled) {
  document.getElementById('userInput').disabled = !enabled;
  updateSendBtn();
}

function updateSendBtn() {
  const val  = document.getElementById('userInput').value.trim();
  const btn  = document.getElementById('sendBtn');
  btn.disabled = !val || isLoading;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  updateSendBtn();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); makeChange(); }
}

// ── NEW REQUEST ──
function newRequest() {
  document.getElementById('messagesInner').innerHTML = '';
  appendBubble('assistant', 'Hi John — describe any change you\'d like to make to the LSCRMA website and I\'ll handle it for you.');
  document.getElementById('userInput').value = '';
  autoResize(document.getElementById('userInput'));
  pendingHTML = null;
  currentSHA  = null;
  isLoading   = false;
  closeMobileSidebar();
}

// ── DIFF ──
function computeDiff(oldText, newText) {
  const oldLines = oldText.split('\n');
  const newLines = newText.split('\n');

  let start = 0;
  const minLen = Math.min(oldLines.length, newLines.length);
  while (start < minLen && oldLines[start] === newLines[start]) start++;

  let oldEnd = oldLines.length - 1;
  let newEnd = newLines.length - 1;
  while (oldEnd > start && newEnd > start && oldLines[oldEnd] === newLines[newEnd]) {
    oldEnd--;
    newEnd--;
  }

  if (start > oldEnd && start > newEnd) {
    return [{ type: 'ctx', text: '(no changes detected)' }];
  }

  const CONTEXT = 3;
  const result  = [];
  const ctxStart = Math.max(0, start - CONTEXT);

  if (ctxStart > 0) result.push({ type: 'sep', text: `… ${ctxStart} unchanged lines …` });
  for (let i = ctxStart; i < start; i++)   result.push({ type: 'ctx', text: oldLines[i] });
  for (let i = start; i <= oldEnd; i++)    result.push({ type: 'del', text: oldLines[i] });
  for (let i = start; i <= newEnd; i++)    result.push({ type: 'add', text: newLines[i] });

  const ctxEnd = Math.min(oldLines.length - 1, oldEnd + CONTEXT);
  for (let i = oldEnd + 1; i <= ctxEnd; i++) result.push({ type: 'ctx', text: oldLines[i] });
  if (ctxEnd < oldLines.length - 1) result.push({ type: 'sep', text: `… ${oldLines.length - 1 - ctxEnd} unchanged lines …` });

  return result;
}

function buildDiffElement(diffLines, onConfirm, onCancel) {
  const wrap = document.createElement('div');

  const addCount = diffLines.filter(l => l.type === 'add').length;
  const delCount = diffLines.filter(l => l.type === 'del').length;

  const summary = document.createElement('p');
  summary.style.cssText = 'font-size:14px;color:#1A1A2E;margin-bottom:10px;';
  summary.textContent = `Here's what will change — ${addCount} line${addCount !== 1 ? 's' : ''} added, ${delCount} removed.`;
  wrap.appendChild(summary);

  const block = document.createElement('div');
  block.className = 'diff-block';
  diffLines.forEach(({ type, text }) => {
    const row = document.createElement('div');
    row.className = 'diff-line ' + type;
    if (type === 'sep') {
      row.textContent = text;
    } else {
      const prefix = document.createElement('span');
      prefix.className = 'diff-prefix';
      prefix.textContent = type === 'add' ? '+' : type === 'del' ? '−' : ' ';
      const content = document.createElement('span');
      content.className = 'diff-text';
      content.textContent = text;
      row.appendChild(prefix);
      row.appendChild(content);
    }
    block.appendChild(row);
  });
  wrap.appendChild(block);

  const actions = document.createElement('div');
  actions.className = 'diff-actions';

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'btn-confirm';
  confirmBtn.textContent = 'Confirm & Publish';
  confirmBtn.onclick = () => onConfirm(confirmBtn, cancelBtn, actions);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-cancel-diff';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.onclick = () => onCancel(actions);

  actions.appendChild(confirmBtn);
  actions.appendChild(cancelBtn);
  wrap.appendChild(actions);

  return wrap;
}

// ── GITHUB: FETCH FILE ──
async function fetchFile() {
  const user  = getSetting('githubUser');
  const repo  = getSetting('githubRepo');
  const file  = getSetting('githubFile') || 'index.html';
  const token = getSetting('githubToken');

  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file}`, {
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Could not read file from GitHub: ' + (err.message || res.status));
  }

  const readData = await res.json();
  const content  = atob(readData.content.replace(/\n/g, ''));
  return { content, sha: readData.sha };
}

// ── SNIPPET EXTRACTION ──
// Extracts a 50-line window from fileContent centred on the best keyword match
// for the user's request. Returns { snippet, startLine } where startLine is the
// 0-based index of the first line of the window inside fileContent's line array.
function extractSnippet(fileContent, userRequest) {
  const lines = fileContent.split('\n');
  const WINDOW = 50;

  // Helper: given a 0-based pivot line, return the 50-line window snippet
  function windowAt(pivot) {
    const half      = Math.floor(WINDOW / 2);
    const startLine = Math.max(0, pivot - half);
    const endLine   = Math.min(lines.length - 1, startLine + WINDOW - 1);
    return { snippet: lines.slice(startLine, endLine + 1).join('\n'), startLine, endLine };
  }

  // Fix 1 — tokenise by splitting on ALL non-alphanumeric chars so that
  // "215-555-0000" yields ["215", "555", "0000"] rather than being dropped.
  const tokens = userRequest
    .toLowerCase()
    .split(/[^a-z0-9]+/)
    .filter(t => t.length > 0);

  // Fix 3 — also try to extract candidate current values from "change X to Y"
  // patterns: pull out digit runs and quoted strings from the request.
  const extraTerms = [];
  const digitRuns = userRequest.match(/\d[\d\-().+ ]*/g) || [];
  digitRuns.forEach(d => {
    d.split(/[^0-9]/).filter(p => p.length > 0).forEach(p => extraTerms.push(p));
  });
  const quoted = userRequest.match(/["']([^"']+)["']/g) || [];
  quoted.forEach(q => extraTerms.push(q.replace(/["']/g, '').toLowerCase()));

  const allTerms = [...new Set([...tokens, ...extraTerms])];

  // Score each line
  let bestLine  = -1;
  let bestScore = 0;
  lines.forEach((line, i) => {
    const lower = line.toLowerCase();
    const score = allTerms.reduce((n, t) => n + (lower.includes(t) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; bestLine = i; }
  });

  // Fix 2 — if nothing scored, fall back to a regex search for any digit
  // sequence from the request directly against the full file string.
  if (bestLine === -1 || bestScore === 0) {
    const numberTokens = userRequest.match(/\d+/g) || [];
    for (const num of numberTokens) {
      const idx = lines.findIndex(l => l.includes(num));
      if (idx !== -1) { bestLine = idx; break; }
    }
  }

  // Still nothing — fall back to the middle of the file
  if (bestLine === -1) bestLine = Math.floor(lines.length / 2);

  return windowAt(bestLine);
}

// ── CLAUDE API ──
// Sends only the relevant snippet; returns { modifiedSnippet, originalSnippet }
async function callClaude(userRequest, snippet) {
  const apiKey = getSetting('anthropicKey');

  const systemPrompt = `You are a precise HTML editor. You will be given a snippet from an HTML file and a change request. Return only the modified snippet with the change applied. Do not return the full file. Do not add explanation, comments, or markdown fences.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 2000,
      system: systemPrompt,
      messages: [{
        role: 'user',
        content: `Here is a snippet from the HTML file:\n\n<snippet>\n${snippet}\n</snippet>\n\nMake this change: ${userRequest}\n\nReturn only the modified snippet with the change applied. Do not return the full file. Do not add explanation.`
      }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Claude API error: ' + (err.error?.message || res.status));
  }

  const data = await res.json();
  let result  = data.content[0]?.text || '';
  // Strip any accidental markdown fences
  result = result.replace(/^```html\n?/i, '').replace(/^```\n?/, '').replace(/\n?```$/, '').trim();
  return result;
}

// ── GITHUB: WRITE FILE ──
async function writeFile(content, sha) {
  const user    = getSetting('githubUser');
  const repo    = getSetting('githubRepo');
  const file    = getSetting('githubFile') || 'index.html';
  const token   = getSetting('githubToken');
  const encoded = btoa(unescape(encodeURIComponent(content)));

  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file}`, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'Site update via LSCRMA Admin',
      content: encoded,
      sha: sha
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('GitHub write failed: ' + (err.message || res.status));
  }
}

// ── MAIN FLOW ──
async function makeChange() {
  if (isLoading) return;

  const userRequest = document.getElementById('userInput').value.trim();
  if (!userRequest) return;

  if (!getSetting('anthropicKey') || !getSetting('githubToken')) {
    openSettings();
    return;
  }

  isLoading = true;
  setInputEnabled(false);
  pendingHTML = null;
  currentSHA  = null;

  // Show user bubble
  appendUserBubble(userRequest);
  document.getElementById('userInput').value = '';
  autoResize(document.getElementById('userInput'));

  // Show thinking
  const thinking = appendThinkingBubble();

  try {
    // Step 1: fetch current file
    const { content: originalHTML, sha } = await fetchFile();
    currentSHA = sha;

    // Step 2: extract the relevant snippet
    const { snippet: originalSnippet } = extractSnippet(originalHTML, userRequest);

    // Step 3: send only the snippet to Claude
    let modifiedSnippet = await callClaude(userRequest, originalSnippet);

    // Step 4: splice back in; if the snippet isn't found verbatim, try chunk fallback
    let splicedHTML = originalHTML.replace(originalSnippet, modifiedSnippet);
    if (splicedHTML === originalHTML) {
      // Fix 4 — last resort: walk 50-line chunks until one produces a real change
      const allLines = originalHTML.split('\n');
      const CHUNK    = 50;
      let found      = false;
      for (let i = 0; i < allLines.length; i += CHUNK) {
        const chunk    = allLines.slice(i, i + CHUNK).join('\n');
        const modified = await callClaude(userRequest, chunk);
        if (modified !== chunk) {
          splicedHTML = originalHTML.replace(chunk, modified);
          if (splicedHTML !== originalHTML) {
            modifiedSnippet = modified;
            found = true;
            break;
          }
        }
      }
      if (!found) {
        throw new Error('Could not locate the relevant section in the file — no changes were made.');
      }
    }

    // Step 5: length validation — reject if more than 5% shorter than the original
    if (splicedHTML.length < originalHTML.length * 0.95) {
      throw new Error('Something went wrong — the proposed change looks incorrect. No changes were made.');
    }

    pendingHTML = splicedHTML;

    // Step 6: build diff and show in bubble
    const diffLines = computeDiff(originalHTML, splicedHTML);

    const diffEl = buildDiffElement(
      diffLines,
      // onConfirm
      async (confirmBtn, cancelBtn, actionsEl) => {
        confirmBtn.disabled = true;
        cancelBtn.disabled  = true;
        confirmBtn.textContent = 'Publishing…';
        try {
          await writeFile(pendingHTML, currentSHA);
          actionsEl.innerHTML = '<span style="color:#0D6B6B;font-size:13px;font-weight:500;">✓ Published — live within 2 minutes.</span>';
          pendingHTML = null;
          currentSHA  = null;
        } catch (err) {
          appendErrorBubble(err.message);
          confirmBtn.disabled    = false;
          cancelBtn.disabled     = false;
          confirmBtn.textContent = 'Confirm & Publish';
        }
        isLoading = false;
        setInputEnabled(true);
      },
      // onCancel
      (_actionsEl) => {
        _actionsEl.innerHTML = '<span style="color:#A0AEC0;font-size:13px;">Cancelled.</span>';
        pendingHTML = null;
        currentSHA  = null;
        isLoading   = false;
        setInputEnabled(true);
      }
    );

    thinking.replace(diffEl);

  } catch (err) {
    thinking.remove();
    appendErrorBubble(err.message);
    isLoading = false;
    setInputEnabled(true);
  }
}

// ── INIT ──
loadSettings();

// Greeting message
appendBubble('assistant', 'Hi John — describe any change you\'d like to make to the LSCRMA website and I\'ll handle it for you.');

// Auto-open settings if not configured
if (!getSetting('anthropicKey') || !getSetting('githubToken')) {
  setTimeout(openSettings, 600);
}

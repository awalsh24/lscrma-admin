<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSCRMA Site Manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sidebar-bg: #1A1A2E;
    --teal: #1A8A8A;
    --teal-bright: #2ABFBF;
    --teal-dark: #0D6B6B;
    --teal-focus: rgba(26,138,138,0.12);
    --text: #1A1A2E;
    --muted: #4A5568;
    --bg: #F8FAFB;
    --white: #FFFFFF;
    --border: #E2E8F0;
    --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --sidebar-w: 260px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
  }

  body { display: flex; flex-direction: row; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    height: 100vh;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Logotype */
  .sidebar-logo {
    padding: 28px 20px 22px;
    text-align: center;
    flex-shrink: 0;
  }
  .logo-top {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--teal-bright);
    line-height: 1;
    margin-bottom: 10px;
  }
  .logo-rule {
    width: 60%;
    margin: 0 auto 10px;
    border: none;
    border-top: 1px solid rgba(255,255,255,0.15);
  }
  .logo-main {
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 5px;
  }
  .logo-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.02em;
  }

  /* New Request button */
  .sidebar-new-btn {
    display: block;
    margin: 0 12px 10px;
    padding: 10px 16px;
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .sidebar-new-btn:hover { background: var(--teal-dark); }

  /* Revert All Changes button */
  .btn-revert-session {
    display: block;
    margin: 0 12px 20px;
    padding: 9px 16px;
    background: none;
    border: 1px solid rgba(239,68,68,0.35);
    color: rgba(239,68,68,0.75);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-revert-session:hover {
    border-color: rgba(239,68,68,0.65);
    color: rgba(239,68,68,1);
    background: rgba(239,68,68,0.06);
  }

  /* History */
  .sidebar-section-label {
    padding: 0 16px 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
  }

  .sidebar-history {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px;
  }
  .sidebar-history::-webkit-scrollbar { width: 3px; }
  .sidebar-history::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .history-item {
    display: block;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: none;
    border-radius: 6px;
    color: rgba(255,255,255,0.7);
    font-family: var(--font);
    font-size: 13px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-item:hover {
    background: rgba(255,255,255,0.06);
    color: var(--white);
  }

  /* Sidebar bottom bar */
  .sidebar-bottom {
    flex-shrink: 0;
    padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-repo {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .repo-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }
  .repo-dot.live { background: #34D399; }
  .repo-label {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-gear {
    background: none;
    border: none;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    font-size: 15px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.2s;
  }
  .sidebar-gear:hover { color: rgba(255,255,255,0.8); }

  /* ── MAIN AREA ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
  }

  /* Chat header */
  .chat-header {
    height: 48px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .chat-header-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  /* Hamburger (mobile only) */
  .hamburger {
    display: none;
    position: absolute;
    left: 16px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }

  /* Messages feed */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .messages-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Bubbles */
  .bubble-row {
    display: flex;
  }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 80%;
    font-size: 14px;
    line-height: 1.6;
    border-radius: 18px;
    padding: 12px 16px;
    word-break: break-word;
  }
  .bubble-row.user .bubble {
    background: var(--teal);
    color: var(--white);
    border-radius: 18px 18px 4px 18px;
  }
  .bubble-row.assistant .bubble {
    background: var(--white);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 18px 18px 18px 4px;
  }
  .bubble-row.assistant.error .bubble {
    background: #FEF2F2;
    border-color: #FECACA;
    color: #991B1B;
  }

  /* Thinking dots */
  .thinking-dots {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 4px 2px;
  }
  .thinking-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    opacity: 0.4;
    animation: tdot 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tdot { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 0.7; transform: scale(1); } }

  /* Diff block inside bubble */
  .diff-block {
    margin-top: 10px;
    background: #1A1A2E;
    border-radius: 8px;
    overflow: hidden;
    max-height: 200px;
    overflow-y: auto;
  }
  .diff-block::-webkit-scrollbar { width: 3px; }
  .diff-block::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .diff-line {
    display: flex;
    padding: 1px 12px;
    font-family: "SF Mono", "Fira Code", Menlo, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre;
  }
  .diff-line.add { color: #2ABFBF; }
  .diff-line.del { color: #FF6B6B; }
  .diff-line.ctx { color: rgba(255,255,255,0.35); }
  .diff-line.sep {
    color: rgba(255,255,255,0.2);
    font-size: 11px;
    justify-content: center;
    padding: 3px 12px;
    font-style: italic;
  }
  .diff-prefix { width: 14px; flex-shrink: 0; }
  .diff-text { flex: 1; overflow-x: hidden; text-overflow: ellipsis; }

  /* Diff action buttons */
  .diff-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn-confirm {
    padding: 9px 20px;
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 50px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-confirm:hover { background: var(--teal-dark); }
  .btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-publish-live {
    padding: 9px 16px;
    background: none;
    border: 1px solid var(--teal);
    color: var(--teal);
    border-radius: 50px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-publish-live:hover { background: var(--teal-focus); }
  .btn-publish-live:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-cancel-diff {
    padding: 9px 16px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 50px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-cancel-diff:hover { border-color: #FECACA; color: #991B1B; }
  .btn-cancel-diff:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ── INPUT AREA ── */
  .input-area {
    flex-shrink: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }
  .input-inner {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  .input-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    background: var(--white);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-box:focus-within {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26,138,138,0.1);
  }
  #userInput {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    resize: none;
    min-height: 22px;
    max-height: 120px;
    overflow-y: auto;
  }
  #userInput::placeholder { color: #A0AEC0; }
  #userInput:disabled { opacity: 0.5; }

  #sendBtn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--teal);
    border: none;
    color: var(--white);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, opacity 0.2s;
    padding: 0;
  }
  #sendBtn:hover:not(:disabled) { background: var(--teal-dark); }
  #sendBtn:disabled { opacity: 0.35; cursor: not-allowed; }
  #sendBtn svg { width: 15px; height: 15px; }

  /* ── SETTINGS PANEL ── */
  .settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.3);
  }
  .settings-overlay.open { display: block; }

  .settings-panel {
    position: fixed;
    top: 0;
    right: -340px;
    width: 320px;
    height: 100vh;
    background: var(--white);
    box-shadow: -4px 0 20px rgba(0,0,0,0.1);
    z-index: 101;
    display: flex;
    flex-direction: column;
    transition: right 0.25s ease;
    overflow-y: auto;
  }
  .settings-panel.open { right: 0; }

  .settings-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .settings-panel-head h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .settings-close {
    background: none;
    border: none;
    font-size: 20px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.15s;
  }
  .settings-close:hover { color: var(--text); }

  .settings-body {
    flex: 1;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .field input {
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26,138,138,0.1);
  }
  .field input::placeholder { color: #A0AEC0; }
  .field-hint {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .field-hint a { color: var(--teal); text-decoration: none; }
  .field-hint a:hover { text-decoration: underline; }
  .token-helper {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }

  .settings-save {
    margin: 8px 24px 24px;
    padding: 13px;
    background: var(--teal);
    color: var(--white);
    border: none;
    border-radius: 50px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .settings-save:hover { background: var(--teal-dark); }

  /* ── MOBILE ── */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      z-index: 50;
      transition: left 0.25s ease;
    }
    .sidebar.open { left: 0; }
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 49;
      background: rgba(0,0,0,0.4);
    }
    .sidebar-overlay.open { display: block; }
    .hamburger { display: flex; }
    .chat-header { position: relative; }
  }
</style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside class="sidebar" id="sidebar">

  <div class="sidebar-logo">
    <div class="logo-top">Life Sciences</div>
    <hr class="logo-rule">
    <div class="logo-main">CRM Advisors</div>
    <div class="logo-sub">Site Manager</div>
  </div>

  <button class="sidebar-new-btn" onclick="newRequest()">+ New Request</button>
  <button class="btn-revert-session" onclick="handleRevertAll()">↩ Revert All Changes</button>

  <div class="sidebar-section-label">Recent Changes</div>
  <div class="sidebar-history">
    <button class="history-item">Phone number update</button>
    <button class="history-item">Hero text change</button>
    <button class="history-item">About section edit</button>
  </div>

  <div class="sidebar-bottom">
    <div class="sidebar-repo">
      <div class="repo-dot" id="repoDot"></div>
      <span class="repo-label" id="repoLabel">Not configured</span>
    </div>
    <button class="sidebar-gear" onclick="openSettings()" title="Settings">⚙</button>
  </div>

</aside>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

<!-- ── MAIN ── -->
<div class="main">

  <div class="chat-header">
    <button class="hamburger" id="hamburger" onclick="openMobileSidebar()">☰</button>
    <span class="chat-header-title">LSCRMA Site Manager</span>
  </div>

  <div class="messages" id="messages">
    <div class="messages-inner" id="messagesInner"></div>
  </div>

  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
        <textarea
          id="userInput"
          placeholder="Describe a change to make to the website..."
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button id="sendBtn" onclick="makeChange()" title="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<!-- ── SETTINGS PANEL ── -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-panel-head">
    <h2>Settings</h2>
    <button class="settings-close" onclick="closeSettings()">×</button>
  </div>
  <div class="settings-body">
    <div class="field">
      <label>Anthropic API Key</label>
      <input type="password" id="anthropicKey" placeholder="sk-ant-..." autocomplete="off">
      <div class="field-hint">Get yours at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> → API Keys</div>
    </div>
    <div class="field">
      <label>🔑 GitHub Personal Access Token</label>
      <input type="password" id="githubToken" placeholder="ghp_..." autocomplete="off">
      <div class="field-hint"><a href="https://github.com/settings/tokens/new" target="_blank">Create one here</a> — enable the <strong>repo</strong> scope.</div>
      <div class="token-helper">Never stored or transmitted anywhere except directly to GitHub.</div>
    </div>
    <div class="field">
      <label>GitHub Username</label>
      <input type="text" id="githubUser" placeholder="awalsh24">
    </div>
    <div class="field">
      <label>Repository Name</label>
      <input type="text" id="githubRepo" placeholder="lscrma.com">
    </div>
    <div class="field">
      <label>HTML Filename</label>
      <input type="text" id="githubFile" placeholder="index.html">
    </div>
  </div>
  <button class="settings-save" onclick="saveSettings()">Save</button>
</div>

<script>
// ── STATE ──
let pendingHTML         = null;
let pendingOriginalHTML = null;
let currentSHA          = null;
let isLoading           = false;
let sessionStartSHA     = null; // preview branch SHA at page load — used by "Revert All"

// ── SETTINGS ──
function loadSettings() {
  ['anthropicKey','githubToken','githubUser','githubRepo','githubFile'].forEach(k => {
    const v = localStorage.getItem('lscrma_' + k);
    if (v) document.getElementById(k).value = v;
  });
  if (!document.getElementById('githubUser').value) document.getElementById('githubUser').value = 'awalsh24';
  if (!document.getElementById('githubRepo').value) document.getElementById('githubRepo').value = 'lscrma.com';
  if (!document.getElementById('githubFile').value) document.getElementById('githubFile').value = 'index.html';
  updateRepoStatus();
}

function saveSettings() {
  ['anthropicKey','githubToken','githubUser','githubRepo','githubFile'].forEach(k => {
    localStorage.setItem('lscrma_' + k, document.getElementById(k).value.trim());
  });
  closeSettings();
  updateRepoStatus();
}

function getSetting(k) { return localStorage.getItem('lscrma_' + k) || ''; }

function updateRepoStatus() {
  const configured = getSetting('anthropicKey') && getSetting('githubToken') && getSetting('githubUser');
  const dot   = document.getElementById('repoDot');
  const label = document.getElementById('repoLabel');
  if (configured) {
    dot.className   = 'repo-dot live';
    label.textContent = getSetting('githubUser') + '/' + getSetting('githubRepo');
  } else {
    dot.className   = 'repo-dot';
    label.textContent = 'Not configured';
  }
}

function openSettings() {
  loadSettings();
  document.getElementById('settingsPanel').classList.add('open');
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsPanel').classList.remove('open');
  document.getElementById('settingsOverlay').classList.remove('open');
}

// ── MOBILE SIDEBAR ──
function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ── CHAT UI ──
function scrollToBottom() {
  const feed = document.getElementById('messages');
  feed.scrollTop = feed.scrollHeight;
}

function appendBubble(role, contentEl) {
  const feed = document.getElementById('messagesInner');
  const row  = document.createElement('div');
  row.className = 'bubble-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (typeof contentEl === 'string') {
    bubble.textContent = contentEl;
  } else {
    bubble.appendChild(contentEl);
  }
  row.appendChild(bubble);
  feed.appendChild(row);
  scrollToBottom();
  return { row, bubble };
}

function appendUserBubble(text) {
  appendBubble('user', text);
}

function appendThinkingBubble() {
  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';
  const { row } = appendBubble('assistant', dots);
  return {
    replace(contentEl) {
      const bubble = row.querySelector('.bubble');
      bubble.innerHTML = '';
      if (typeof contentEl === 'string') {
        bubble.textContent = contentEl;
      } else {
        bubble.appendChild(contentEl);
      }
      scrollToBottom();
      return bubble;
    },
    remove() { row.remove(); }
  };
}

function appendErrorBubble(message) {
  const { row } = appendBubble('assistant', message);
  row.classList.add('error');
}

// ── INPUT HELPERS ──
function setInputEnabled(enabled) {
  document.getElementById('userInput').disabled = !enabled;
  updateSendBtn();
}

function updateSendBtn() {
  const val  = document.getElementById('userInput').value.trim();
  const btn  = document.getElementById('sendBtn');
  btn.disabled = !val || isLoading;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  updateSendBtn();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); makeChange(); }
}

// ── NEW REQUEST ──
function newRequest() {
  document.getElementById('messagesInner').innerHTML = '';
  appendBubble('assistant', 'Hi John — describe any change you\'d like to make to the website. Changes will appear on the preview site first at preview.lscrma-com.pages.dev. You can review them before publishing to the live site.');
  document.getElementById('userInput').value = '';
  autoResize(document.getElementById('userInput'));
  pendingHTML         = null;
  pendingOriginalHTML = null;
  currentSHA          = null;
  isLoading           = false;
  // NOTE: sessionStartSHA is intentionally preserved across new requests
  closeMobileSidebar();
}

// ── DIFF ──
// Builds a diff block from an array of {find, replace, explanation} operations.
function buildFindReplaceDiff(operations) {
  const wrap = document.createElement('div');

  function makeLine(type, prefix, text) {
    const row = document.createElement('div');
    row.className = 'diff-line ' + type;
    const pre = document.createElement('span');
    pre.className = 'diff-prefix';
    pre.textContent = prefix;
    const content = document.createElement('span');
    content.className = 'diff-text';
    content.textContent = text;
    row.appendChild(pre);
    row.appendChild(content);
    return row;
  }

  operations.forEach((op, i) => {
    const summary = document.createElement('p');
    summary.style.cssText = 'font-size:14px;color:#1A1A2E;margin-bottom:8px;' + (i > 0 ? 'margin-top:14px;' : '');
    summary.textContent = op.explanation;
    wrap.appendChild(summary);

    const block = document.createElement('div');
    block.className = 'diff-block';
    block.appendChild(makeLine('del', '−', op.find));
    block.appendChild(makeLine('add', '+', op.replace));
    wrap.appendChild(block);
  });

  return wrap;
}

// Wraps a pre-built content element in a bubble with three action buttons.
function buildDiffElement(contentEl, priorPreviewSHA, onPublish, onDiscard) {
  const wrap = document.createElement('div');
  wrap.appendChild(contentEl);

  const actions = document.createElement('div');
  actions.className = 'diff-actions';

  const previewBtn = document.createElement('button');
  previewBtn.className = 'btn-confirm';
  previewBtn.textContent = 'Open Preview';
  previewBtn.onclick = () => {
    window.open('https://preview.lscrma-com.pages.dev', '_blank');
  };

  const publishBtn = document.createElement('button');
  publishBtn.className = 'btn-publish-live';
  publishBtn.textContent = 'Publish to Live';
  publishBtn.onclick = () => onPublish(previewBtn, publishBtn, discardBtn, actions);

  const discardBtn = document.createElement('button');
  discardBtn.className = 'btn-cancel-diff';
  discardBtn.textContent = 'Discard';
  discardBtn.onclick = () => onDiscard(previewBtn, publishBtn, discardBtn, actions, priorPreviewSHA);

  actions.appendChild(previewBtn);
  actions.appendChild(publishBtn);
  actions.appendChild(discardBtn);
  wrap.appendChild(actions);

  const note = document.createElement('p');
  note.style.cssText = 'font-size:11px;color:#A0AEC0;margin-top:8px;';
  note.textContent = 'Preview updates within 60 seconds of your change.';
  wrap.appendChild(note);

  return wrap;
}

// ── GITHUB: GET BRANCH SHA ──
async function getBranchSHA(branch, token) {
  const user = getSetting('githubUser');
  const repo = getSetting('githubRepo');
  const res = await fetch(
    `https://api.github.com/repos/${user}/${repo}/git/refs/heads/${branch}`,
    { headers: { Authorization: `token ${token}` } }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Could not get branch SHA: ' + (err.message || res.status));
  }
  const data = await res.json();
  return data.object.sha;
}

// ── GITHUB: FETCH FILE (from preview branch) ──
async function fetchFile() {
  const user  = getSetting('githubUser');
  const repo  = getSetting('githubRepo');
  const file  = getSetting('githubFile') || 'index.html';
  const token = getSetting('githubToken');

  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file}?ref=preview`, {
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Could not read file from GitHub: ' + (err.message || res.status));
  }

  const readData = await res.json();
  const content  = decodeURIComponent(
    atob(readData.content.replace(/\n/g, ''))
      .split('')
      .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
      .join('')
  );
  return { content, sha: readData.sha };
}

// ── CLAUDE API ──
// Sends the full file to Claude; returns a JSON array of {find, replace, explanation} operations.
async function callClaude(userRequest, currentContent) {
  const apiKey = getSetting('anthropicKey');

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      system: `You are a precise HTML editor. You will be given a complete HTML file and a change request.

Your job is to identify the exact string(s) that need to change and return ONLY a JSON array of find/replace operations — nothing else. No explanation, no markdown, no code fences, just the raw JSON array.

Rules:
- "find" must be the exact substring as it appears in the file, including all whitespace, quotes, and special characters
- "replace" is the new string that should take its place
- Keep find strings as short as possible while still being unique in the file
- For phone numbers: target both the href value (tel:+12152191152) and the visible text (+1 (215) 219-1152) as separate operations
- For email: target both the href value (mailto:...) and visible text as separate operations
- Never modify placeholder, aria-label, alt, or comment text unless explicitly asked
- If content spans multiple lines, include the newlines in the find string exactly as they appear
- Return an empty array [] if no change is needed

Return format — raw JSON only, no wrapping:
[
  {"find": "exact current string", "replace": "new string", "explanation": "one sentence"},
  {"find": "another current string", "replace": "another new string", "explanation": "one sentence"}
]`,
      messages: [{
        role: 'user',
        content: `Here is the complete HTML file:\n\n${currentContent}\n\nChange request: ${userRequest}`
      }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Claude API error: ' + (err.error?.message || res.status));
  }

  const data = await res.json();
  const raw = data.content.map(b => b.text || '').join('').trim();
  const cleaned = raw.replace(/^```json\n?/i, '').replace(/^```\n?/, '').replace(/```$/, '').trim();
  const parsed = JSON.parse(cleaned);
  return Array.isArray(parsed) ? parsed : [parsed];
}

// ── GITHUB: WRITE FILE ──
function encodeContent(str) {
  return btoa(
    encodeURIComponent(str)
      .replace(/%([0-9A-F]{2})/g, (_, p1) =>
        String.fromCharCode('0x' + p1)
      )
  );
}

async function putFile(user, repo, file, token, message, content, sha, branch) {
  const body = { message, content: encodeContent(content), sha };
  if (branch) body.branch = branch;
  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file}`, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('GitHub write failed: ' + (err.message || res.status));
  }
  return res.json();
}

async function backupAndWrite(modifiedContent, originalContent, sha, userRequest) {
  const user  = getSetting('githubUser');
  const repo  = getSetting('githubRepo');
  const file  = getSetting('githubFile') || 'index.html';
  const token = getSetting('githubToken');

  // Step 1: fresh read from preview branch to get the latest file SHA
  const freshRes = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file}?ref=preview`, {
    headers: {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });
  if (!freshRes.ok) {
    const err = await freshRes.json().catch(() => ({}));
    throw new Error('Could not refresh file SHA: ' + (err.message || freshRes.status));
  }
  const freshData  = await freshRes.json();
  const freshSHA   = freshData.sha;

  // Step 2: backup commit — write the original content to the preview branch
  const backupMsg  = 'Pre-edit backup — ' + userRequest.slice(0, 50);
  const backupData = await putFile(user, repo, file, token, backupMsg, originalContent, freshSHA, 'preview');
  const backupSHA  = backupData.content.sha;

  // Step 3: write the actual modified file to the preview branch
  await putFile(user, repo, file, token, 'Site update via LSCRMA Admin', modifiedContent, backupSHA, 'preview');
}

// ── GITHUB: MERGE PREVIEW INTO MAIN ──
async function mergeToMain(token) {
  const user = getSetting('githubUser');
  const repo = getSetting('githubRepo');
  const res = await fetch(
    `https://api.github.com/repos/${user}/${repo}/merges`,
    {
      method: 'POST',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        base: 'main',
        head: 'preview',
        commit_message: 'Publish via LSCRMA Admin'
      })
    }
  );
  if (!res.ok) throw new Error('Merge failed');
}

// ── GITHUB: DISCARD ONE CHANGE (reset preview to before this change) ──
async function discardChange(token, previousSHA) {
  const user = getSetting('githubUser');
  const repo = getSetting('githubRepo');
  const res = await fetch(
    `https://api.github.com/repos/${user}/${repo}/git/refs/heads/preview`,
    {
      method: 'PATCH',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ sha: previousSHA, force: true })
    }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Discard failed: ' + (err.message || res.status));
  }
}

// ── GITHUB: REVERT ALL SESSION CHANGES ──
async function revertSession(token) {
  const user = getSetting('githubUser');
  const repo = getSetting('githubRepo');
  const res = await fetch(
    `https://api.github.com/repos/${user}/${repo}/git/refs/heads/preview`,
    {
      method: 'PATCH',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ sha: sessionStartSHA, force: true })
    }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error('Revert failed: ' + (err.message || res.status));
  }
}

// ── REVERT ALL HANDLER ──
async function handleRevertAll() {
  if (!sessionStartSHA) {
    appendErrorBubble('No session start snapshot available — open Settings to configure your GitHub token, then try again.');
    return;
  }
  const confirmed = confirm('This will undo all changes made in this session and restore the preview site to how it was when you opened this page. Are you sure?');
  if (!confirmed) return;

  const token = getSetting('githubToken');
  try {
    await revertSession(token);
    appendBubble('assistant', '✓ All session changes reverted — preview restored to original state.');
  } catch (err) {
    appendErrorBubble(err.message);
  }
}

// ── MAIN FLOW ──
async function makeChange() {
  if (isLoading) return;

  const userRequest = document.getElementById('userInput').value.trim();
  if (!userRequest) return;

  if (!getSetting('anthropicKey') || !getSetting('githubToken')) {
    openSettings();
    return;
  }

  isLoading = true;
  setInputEnabled(false);
  pendingHTML         = null;
  pendingOriginalHTML = null;
  currentSHA          = null;

  // Show user bubble
  appendUserBubble(userRequest);
  document.getElementById('userInput').value = '';
  autoResize(document.getElementById('userInput'));

  // Show thinking
  const thinking = appendThinkingBubble();

  try {
    const token = getSetting('githubToken');

    // Capture preview branch tip SHA (for Discard) and fetch file in parallel
    const [priorPreviewSHA, fileData] = await Promise.all([
      getBranchSHA('preview', token),
      fetchFile()
    ]);

    // Seed sessionStartSHA on first use
    if (!sessionStartSHA) sessionStartSHA = priorPreviewSHA;

    const { content: originalHTML, sha } = fileData;
    currentSHA          = sha;
    pendingOriginalHTML = originalHTML;

    // Ask Claude for find/replace operations (sends full file)
    const operations = await callClaude(userRequest, originalHTML);

    // Validate each find string exists, and that it differs from replace
    for (const op of operations) {
      if (!originalHTML.includes(op.find)) {
        throw new Error(`Could not find "${op.find}" in the file. Try being more specific.`);
      }
      if (op.find === op.replace) {
        throw new Error('No change needed — that content already matches.');
      }
    }

    // Apply all replacements sequentially
    let splicedHTML = originalHTML;
    for (const op of operations) {
      splicedHTML = splicedHTML.split(op.find).join(op.replace);
    }

    // Length validation — reject if more than 5% shorter than the original
    if (splicedHTML.length < originalHTML.length * 0.95) {
      throw new Error('Something went wrong — the proposed change looks incorrect. No changes were made.');
    }

    pendingHTML = splicedHTML;

    // Write to preview branch immediately (before showing diff)
    await backupAndWrite(pendingHTML, pendingOriginalHTML, currentSHA, userRequest);

    // Build diff and show in bubble with three action buttons
    const diffEl = buildDiffElement(
      buildFindReplaceDiff(operations),
      priorPreviewSHA,
      // onPublish
      async (previewBtn, publishBtn, discardBtn, actionsEl) => {
        previewBtn.disabled = true;
        publishBtn.disabled = true;
        discardBtn.disabled = true;
        publishBtn.textContent = 'Publishing…';
        try {
          await mergeToMain(token);
          actionsEl.innerHTML = '<span style="color:#0D6B6B;font-size:13px;font-weight:500;">✓ Published to lscrma.com — live within 60 seconds.</span>';
          pendingHTML = null;
          currentSHA  = null;
        } catch (err) {
          appendErrorBubble(err.message);
          previewBtn.disabled    = false;
          publishBtn.disabled    = false;
          discardBtn.disabled    = false;
          publishBtn.textContent = 'Publish to Live';
        }
        isLoading = false;
        setInputEnabled(true);
      },
      // onDiscard
      async (previewBtn, publishBtn, discardBtn, actionsEl, previousSHA) => {
        previewBtn.disabled = true;
        publishBtn.disabled = true;
        discardBtn.disabled = true;
        discardBtn.textContent = 'Discarding…';
        try {
          await discardChange(token, previousSHA);
          actionsEl.innerHTML = '<span style="color:#A0AEC0;font-size:13px;">Change discarded — preview restored.</span>';
          pendingHTML         = null;
          pendingOriginalHTML = null;
          currentSHA          = null;
        } catch (err) {
          appendErrorBubble(err.message);
          previewBtn.disabled    = false;
          publishBtn.disabled    = false;
          discardBtn.disabled    = false;
          discardBtn.textContent = 'Discard';
        }
        isLoading = false;
        setInputEnabled(true);
      }
    );

    thinking.replace(diffEl);

  } catch (err) {
    thinking.remove();
    appendErrorBubble(err.message);
    isLoading = false;
    setInputEnabled(true);
  }
}

// ── INIT ──
loadSettings();

// Greeting message
appendBubble('assistant', 'Hi John — describe any change you\'d like to make to the website. Changes will appear on the preview site first at preview.lscrma-com.pages.dev. You can review them before publishing to the live site.');

// Seed sessionStartSHA if token is already configured
if (getSetting('githubToken') && getSetting('githubUser')) {
  getBranchSHA('preview', getSetting('githubToken'))
    .then(sha => { sessionStartSHA = sha; })
    .catch(() => { /* will be seeded on first makeChange if token becomes valid */ });
}

// Auto-open settings if not configured
if (!getSetting('anthropicKey') || !getSetting('githubToken')) {
  setTimeout(openSettings, 600);
}
</script>
